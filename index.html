<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmpatIA - dashboard publico</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 48px 24px; min-height: 100vh; box-sizing: border-box;
    background: #faf9f7; color: #1f1b16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16130f; color: #f1ede6; }
  }
  main { max-width: 520px; width: 100%; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.subtitulo { opacity: 0.75; margin-top: 0; margin-bottom: 2rem; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a.edicion {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-radius: 12px; text-decoration: none;
    color: inherit; background: rgba(127,127,127,0.08);
    border: 1px solid rgba(127,127,127,0.18);
    font-size: 1.05rem; font-weight: 600;
    transition: background 0.15s ease;
  }
  a.edicion:hover { background: rgba(127,127,127,0.16); }
  a.edicion span.flecha { opacity: 0.5; font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>EmpatIA - dashboard publico</h1>
  <p class="subtitulo">Ranking, importancia y territorios de marca por edicion del estudio.</p>
  <ul>
    <li><a class="edicion" href="2026/"><span>Edicion 2026</span><span class="flecha">&rarr;</span></a></li>
    <li><a class="edicion" href="2025/"><span>Edicion 2025</span><span class="flecha">&rarr;</span></a></li>
    <li><a class="edicion" href="2024/"><span>Edicion 2024</span><span class="flecha">&rarr;</span></a></li>
    <li><a class="edicion" href="2023/"><span>Edicion 2023</span><span class="flecha">&rarr;</span></a></li>
  </ul>
</main>
</body>
</html>
